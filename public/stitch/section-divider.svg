<!-- Modern Japanese Wabi-Sabi dividers, corner ornaments, and decorative motifs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60" fill="none">
  <!-- Double hairline horizontal separator with central diamond crest -->
  <path d="M 40,28 L 360,28 M 440,28 L 760,28" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <path d="M 40,32 L 360,32 M 440,32 L 760,32" stroke="currentColor" stroke-width="0.7" opacity="0.18"/>
  <g transform="translate(400, 30)">
    <!-- Seigaiha concentric crest arches -->
    <path d="M -18,6 C -18,-6 -9,-14 0,-14 C 9,-14 18,-6 18,6" stroke="#c83c23" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M -11,6 C -11,-2 -5,-8 0,-8 C 5,-8 11,-2 11,6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="0" cy="4" r="1.8" fill="#c83c23"/>
  </g>
</svg>