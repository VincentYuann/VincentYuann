    <!-- Anti-Flash Blocking Theme Script (Executes synchronously before first paint) -->
    <script>
      (function() {
        try {
          var key = 'portfolio-theme';
          var stored = localStorage.getItem(key);
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || 'light';
          var resolved = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          
          var doc = document.documentElement;
          doc.classList.remove('light', 'dark');
          doc.classList.add(resolved);
          doc.setAttribute('data-theme', resolved);
          doc.style.colorScheme = resolved === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts for Editorial & Technical Aesthetic (Montserrat & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
